name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: open-watcom/setup-watcom@v1
        with:
          version: '1.9'
          target: dos
      - run: wmake all
      - uses: actions/upload-artifact@v7
        with:
          name: scsitb
          path: scsitb.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" scsitb.exe --repo "$GITHUB_REPOSITORY" --generate-notes
